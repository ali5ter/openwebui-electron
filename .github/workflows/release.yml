name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: src
        run: npm install

      - name: Build DMG and zip
        run: ./scripts/build.sh --mac

      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          files: src/dist/OpenWebUI-*.dmg
          generate_release_notes: true

      - name: Upload zip
        uses: softprops/action-gh-release@v2
        with:
          files: src/dist/OpenWebUI-*.zip
          generate_release_notes: true

      - name: Publish to Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for arch in arm64 x64; do
            DMG="src/dist/OpenWebUI-${VERSION}-${arch}.dmg"
            if [[ ! -f "${DMG}" ]]; then
              echo "error: ${DMG} not found. The tag v${VERSION} must match the version in src/package.json." >&2
              ls src/dist/ >&2
              exit 1
            fi
          done
          SHA256_ARM=$(shasum -a 256 "src/dist/OpenWebUI-${VERSION}-arm64.dmg" | awk '{print $1}')
          SHA256_INTEL=$(shasum -a 256 "src/dist/OpenWebUI-${VERSION}-x64.dmg" | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ali5ter/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Casks

          cat > "/tmp/homebrew-tap/Casks/openwebui-electron.rb" <<EOF
          cask "openwebui-electron" do
            arch arm: "arm64", intel: "x64"

            version "${VERSION}"
            sha256 arm:   "${SHA256_ARM}",
                   intel: "${SHA256_INTEL}"

            url "https://github.com/ali5ter/openwebui-electron/releases/download/v#{version}/OpenWebUI-#{version}-#{arch}.dmg"
            name "OpenWebUI"
            desc "Desktop app for local OpenWebUI instances"
            homepage "https://github.com/ali5ter/openwebui-electron"

            app "OpenWebUI.app"

            uninstall quit: "com.openwebui.desktop"

            caveats <<~EOS
              This app is ad-hoc signed, not notarized. On first launch, macOS may show a warning.

              In Finder, open the Applications folder, right-click OpenWebUI.app, choose
              **Open**, then click **Open** in the dialog.
              Or run: xattr -d com.apple.quarantine /Applications/OpenWebUI.app

              If OpenWebUI runs on another machine, allow the app under
              System Settings > Privacy & Security > Local Network when macOS asks.
            EOS
          end
          EOF

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/openwebui-electron.rb
          git commit -m "chore: update openwebui-electron cask to v${VERSION}" || echo "No changes to commit"
          git push origin main
